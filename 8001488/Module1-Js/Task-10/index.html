<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 10 - Modern JavaScript Features</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app {
            width: 100%;
            max-width: 1000px;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            overflow: hidden;
            backdrop-filter: blur(12px);
        }
        .header,
        .footer {
            padding: 25px;
            background: rgba(255,255,255,0.05);
        }
        .header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }
        .header p {
            margin: 0;
            opacity: 0.8;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 25px;
            align-items: center;
            background: rgba(0,0,0,0.15);
        }
        .controls input,
        .controls select,
        .controls button {
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
        }
        .controls input,
        .controls select {
            background: rgba(255,255,255,0.12);
            color: #071e3d;
            min-width: 180px;
        }
        .controls select option {
            color: #071e3d;
        }
        .controls button {
            background: #ff8c00;
            color: #071e3d;
            cursor: pointer;
            font-weight: bold;
        }
        .controls button:hover {
            transform: translateY(-1px);
        }
        .content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 25px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        .card-title {
            margin: 0 0 10px;
            font-size: 18px;
            color: #ffeb99;
        }
        .card-content {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.9;
        }
        .card span {
            display: block;
            margin-bottom: 8px;
        }
        .note {
            padding: 15px 20px;
            margin: 0 25px 20px;
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            color: #ddf7ff;
            font-size: 14px;
        }
        @media (max-width: 640px) {
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>Task 10 - Modern JavaScript Features</h1>
            <p>Use ES6+ syntax to manage event data, filter it, and display it cleanly.</p>
        </div>
        <div class="controls">
            <input id="searchInput" type="text" placeholder="Search event name...">
            <select id="categoryInput">
                <option value="">All categories</option>
                <option value="Music">Music</option>
                <option value="Sports">Sports</option>
                <option value="Food">Food</option>
                <option value="Art">Art</option>
                <option value="Tech">Tech</option>
            </select>
            <button onclick="displayFilteredEvents()">Filter Events</button>
        </div>
        <div class="note">The event list is cloned using the spread operator before filtering. Destructuring is used to extract event details while rendering.</div>
        <div id="eventsContainer" class="content"></div>
        <div class="footer">
            <p>Event Count: <span id="eventCount">0</span></p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
