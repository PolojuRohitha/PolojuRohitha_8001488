<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 14 - jQuery and JS Frameworks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            color: #0f172a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            margin-top: 0;
            margin-bottom: 24px;
            line-height: 1.6;
            color: #475569;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        select,
        button {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 14px;
            color: #0f172a;
        }
        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .event-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }
        .event-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
        }
        .event-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .event-card p {
            margin: 6px 0;
            color: #475569;
        }
        .note {
            margin-top: 26px;
            padding: 16px;
            border-radius: 14px;
            background: #eef2ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task 14 - jQuery and JS Frameworks</h1>
        <p>Use jQuery to handle button clicks and animate event cards. This example also mentions a framework benefit.</p>
        <div class="controls">
            <select id="eventSelect">
                <option value="">Select event to register</option>
            </select>
            <button id="registerBtn">Register</button>
            <button id="showCardsBtn">Show Events</button>
        </div>
        <div class="event-container" id="eventsContainer"></div>
        <div class="note">
            Benefit: moving to frameworks like React or Vue helps manage UI state and reusable components more easily than manual DOM manipulation.
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
