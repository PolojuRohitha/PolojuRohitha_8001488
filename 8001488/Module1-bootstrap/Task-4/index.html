<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Task 4</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Bootstrap Task 4: Column Layouts and Grid Classes</h1>

        <section class="mb-5">
            <h2 class="h4 mb-3">Exercise 4.1: Sidebar and Content Layout</h2>
            <div class="row">
                <div class="col-12 col-md-3">
                    <div class="p-3 border bg-light">Sidebar</div>
                </div>
                <div class="col-12 col-md-9">
                    <div class="p-3 border bg-white">Content area </div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="h4 mb-3">Exercise 4.2: Four Equal Columns</h2>
            <div class="row g-3">
                <div class="col-12 col-sm-3">
                    <div class="p-3 border bg-light text-center">Column 1</div>
                </div>
                <div class="col-12 col-sm-3">
                    <div class="p-3 border bg-light text-center">Column 2</div>
                </div>
                <div class="col-12 col-sm-3">
                    <div class="p-3 border bg-light text-center">Column 3</div>
                </div>
                <div class="col-12 col-sm-3">
                    <div class="p-3 border bg-light text-center">Column 4</div>
                </div>
            </div>
        </section>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
