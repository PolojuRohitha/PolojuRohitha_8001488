<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Task 8</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Bootstrap Task 8: Forms</h1>

        <section class="mb-5">
            <h2 class="h4 mb-3">Exercise 8.1: Registration Form</h2>
            <form class="border rounded p-4 bg-light">
                <div class="mb-3">
                    <label for="regName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="regName" placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                    <label for="regEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="regEmail" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">*</span>
                        <input type="password" class="form-control" id="regPassword" placeholder="Create a password">
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="regTerms">
                    <label class="form-check-label" for="regTerms">
                        I agree to the terms and conditions
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
        </section>

        <section>
            <h2 class="h4 mb-3">Exercise 8.2: Login Form</h2>
            <form class="border rounded p-4 bg-light">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com">
                    <label for="loginEmail">Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password">
                    <label for="loginPassword">Password</label>
                </div>
                <button type="submit" class="btn btn-success">Login</button>
            </form>
        </section>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
