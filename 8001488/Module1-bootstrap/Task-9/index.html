<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Task 9</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Bootstrap Task 9: Buttons</h1>

        <section class="mb-5">
            <h2 class="h4 mb-3">Exercise 9.1: Contextual Buttons</h2>
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button id="btnPrimary" class="btn btn-primary">Primary</button>
                <button id="btnSecondary" class="btn btn-secondary">Secondary</button>
                <button id="btnSuccess" class="btn btn-success">Success</button>
                <button id="btnDanger" class="btn btn-danger">Danger</button>
                <button id="btnWarning" class="btn btn-warning">Warning</button>
                <button id="btnInfo" class="btn btn-info">Info</button>
                <button id="btnLight" class="btn btn-light">Light</button>
                <button id="btnDark" class="btn btn-dark">Dark</button>
                <button id="btnLink" class="btn btn-link">Link</button>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button id="btnOutlinePrimary" class="btn btn-outline-primary">Outline Primary</button>
                <button id="btnOutlineSecondary" class="btn btn-outline-secondary">Outline Secondary</button>
                <button id="btnOutlineSuccess" class="btn btn-outline-success">Outline Success</button>
                <button id="btnOutlineDanger" class="btn btn-outline-danger">Outline Danger</button>
                <button id="btnOutlineWarning" class="btn btn-outline-warning">Outline Warning</button>
                <button id="btnOutlineInfo" class="btn btn-outline-info">Outline Info</button>
                <button id="btnOutlineDark" class="btn btn-outline-dark">Outline Dark</button>
            </div>
            <p id="buttonStatus" class="mt-3 text-muted">Clicked button: none</p>
        </section>

        <section>
            <h2 class="h4 mb-3">Exercise 9.2: Button Groups and Toggle Buttons</h2>
            <div class="mb-4">
                <div class="btn-group" role="group" aria-label="Basic button group">
                    <button type="button" class="btn btn-secondary" id="groupLeft">Left</button>
                    <button type="button" class="btn btn-secondary" id="groupMiddle">Middle</button>
                    <button type="button" class="btn btn-secondary" id="groupRight">Right</button>
                </div>
                <p id="groupStatus" class="mt-2 text-muted">Button group selection: none</p>
            </div>

            <div class="btn-group" role="group" aria-label="Toggle button group">
                <input type="checkbox" class="btn-check" id="btncheck1" autocomplete="off">
                <label class="btn btn-outline-primary" for="btncheck1">Toggle 1</label>

                <input type="checkbox" class="btn-check" id="btncheck2" autocomplete="off">
                <label class="btn btn-outline-primary" for="btncheck2">Toggle 2</label>

                <input type="checkbox" class="btn-check" id="btncheck3" autocomplete="off">
                <label class="btn btn-outline-primary" for="btncheck3">Toggle 3</label>
            </div>
            <p id="toggleStatus" class="mt-2 text-muted">Toggles active: none</p>
        </section>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const buttonStatus = document.getElementById('buttonStatus');

        const buttonActions = {
            btnPrimary: 'Primary button selected.',
            btnSecondary: 'Secondary button selected.',
            btnSuccess: 'Success action confirmed.',
            btnDanger: 'Danger action acknowledged.',
            btnWarning: 'Warning style clicked.',
            btnInfo: 'Info button clicked.',
            btnLight: 'Light button clicked.',
            btnDark: 'Dark button clicked.',
            btnLink: 'Link-style button clicked.',
            btnOutlinePrimary: 'Outline primary button selected.',
            btnOutlineSecondary: 'Outline secondary button selected.',
            btnOutlineSuccess: 'Outline success button selected.',
            btnOutlineDanger: 'Outline danger button selected.',
            btnOutlineWarning: 'Outline warning button selected.',
            btnOutlineInfo: 'Outline info button selected.',
            btnOutlineDark: 'Outline dark button selected.'
        };

        Object.keys(buttonActions).forEach(id => {
            const button = document.getElementById(id);
            if (!button) return;
            button.addEventListener('click', () => {
                buttonStatus.textContent = buttonActions[id];
            });
        });

        const groupStatus = document.getElementById('groupStatus');
        ['groupLeft', 'groupMiddle', 'groupRight'].forEach(id => {
            document.getElementById(id).addEventListener('click', event => {
                groupStatus.textContent = `Button group selection: ${event.target.textContent}`;
            });
        });

        const toggleStatus = document.getElementById('toggleStatus');
        const updateToggleStatus = () => {
            const active = [];
            ['btncheck1', 'btncheck2', 'btncheck3'].forEach(id => {
                const checkbox = document.getElementById(id);
                if (checkbox.checked) active.push(checkbox.nextElementSibling.textContent);
            });
            toggleStatus.textContent = `Toggles active: ${active.length ? active.join(', ') : 'none'}`;
        };
        ['btncheck1', 'btncheck2', 'btncheck3'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateToggleStatus);
        });
    </script>
</body>
</html>
