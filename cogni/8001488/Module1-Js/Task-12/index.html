<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 12 - AJAX & Fetch API</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #0f172a;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.1);
            padding: 32px;
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
        }
        p {
            margin: 8px 0 24px;
            color: #475569;
            line-height: 1.6;
        }
        .field {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        input,
        select,
        button {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }
        button {
            background: #7c3aed;
            color: white;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        button:hover {
            transform: translateY(-1px);
        }
        .spinner {
            display: none;
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #ede9fe;
            border-top: 4px solid #7c3aed;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .spinner.show {
            display: block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .message {
            padding: 16px;
            border-radius: 14px;
            margin-top: 20px;
            display: none;
        }
        .message.show {
            display: block;
        }
        .success {
            background: #ecfdf5;
            color: #166534;
            border: 1px solid #a7f3d0;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .error-list {
            margin-top: 10px;
            padding-left: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AJAX & Fetch API</h1>
        <p>Submit your registration and simulate backend communication with a delayed response.</p>
        <form id="registrationForm">
            <div class="field">
                <label for="name">Full Name</label>
                <input id="name" name="name" type="text" placeholder="Enter your name">
            </div>
            <div class="field">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="Enter your email">
            </div>
            <div class="field">
                <label for="selectedEvent">Choose Event</label>
                <select id="selectedEvent" name="selectedEvent">
                    <option value="">Select an event</option>
                    <option value="Jazz Night">Jazz Night</option>
                    <option value="Tech Summit">Tech Summit</option>
                    <option value="Food Bazaar">Food Bazaar</option>
                    <option value="Art Retreat">Art Retreat</option>
                </select>
            </div>
            <button type="submit">Send Registration</button>
        </form>
        <div id="loadingSpinner" class="spinner"></div>
        <div id="resultMessage" class="message"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
