<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 - Objects and Prototypes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .section {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .full-width {
            grid-column: 1 / -1;
        }
        input, button {
            padding: 8px 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 3px;
            display: block;
            width: 95%;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .event-card {
            background-color: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #007bff;
            border-radius: 3px;
        }
        .properties {
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
        .property {
            margin: 5px 0;
            padding: 5px;
            background-color: white;
            border-radius: 2px;
        }
        .available {
            color: green;
            font-weight: bold;
        }
        .unavailable {
            color: red;
            font-weight: bold;
        }
        .message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Task 5 - Objects and Prototypes</h1>
    
    <div class="container">
        <div class="section">
            <h2>Create Event Object</h2>
            <input type="text" id="eventName" placeholder="Event Name">
            <input type="text" id="eventCategory" placeholder="Category">
            <input type="date" id="eventDate" placeholder="Date">
            <input type="number" id="eventSeats" placeholder="Available Seats">
            <button onclick="createNewEvent()">Create Event</button>
            <div id="createMessage"></div>
        </div>
        
        <div class="section">
            <h2>Check Event Availability</h2>
            <div id="availabilityDisplay"></div>
        </div>
        
        <div class="section full-width">
            <h2>Event Objects - All Properties (Using Object.entries())</h2>
            <div id="eventsList"></div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
