<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 8 - Event Handling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }
        
        header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .controls-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            margin-bottom: 30px;
        }
        
        .control-row {
            margin-bottom: 20px;
        }
        
        .control-row:last-child {
            margin-bottom: 0;
        }
        
        .control-row label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        input, select {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.3);
        }
        
        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.info {
            background-color: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .events-section {
            margin-bottom: 30px;
        }
        
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .events-header h2 {
            color: white;
            font-size: 24px;
        }
        
        .event-count {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        #eventsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        
        .event-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 0.4s ease-out;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .event-header {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .event-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .event-category {
            font-size: 12px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 3px;
        }
        
        .event-body {
            padding: 20px;
        }
        
        .event-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        
        .event-detail:last-of-type {
            border-bottom: none;
        }
        
        .event-detail-label {
            font-weight: bold;
            color: #333;
        }
        
        .event-detail-value {
            color: #666;
        }
        
        .seats-available {
            color: #28a745;
            font-weight: bold;
        }
        
        .seats-unavailable {
            color: #dc3545;
            font-weight: bold;
        }
        
        .event-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .event-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-register {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        
        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-register:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #ccc;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        
        .search-hint {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .control-group {
                grid-template-columns: 1fr;
            }
            
            #eventsContainer {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Task 8 - Event Handling</h1>
            <p>Interactive Event Management with Event Handlers</p>
        </header>
        
        <div class="controls-section">
            <h2 style="margin-bottom: 20px; color: #333;">Filter & Search Events</h2>
            
            <div class="control-group">
                <div class="control-row">
                    <label for="searchInput">Search by Event Name (keydown)</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Type to search events..." 
                        onkeydown="handleSearchKeydown(event)">
                    <div class="search-hint">Press any key to search in real-time</div>
                </div>
                
                <div class="control-row">
                    <label for="categoryFilter">Filter by Category (onchange)</label>
                    <select id="categoryFilter" onchange="handleCategoryChange(event)">
                        <option value="">All Categories</option>
                        <option value="Music">Music</option>
                        <option value="Sports">Sports</option>
                        <option value="Food">Food</option>
                        <option value="Art">Art</option>
                        <option value="Tech">Tech</option>
                    </select>
                </div>
            </div>
            
            <div id="messageContainer" class="message"></div>
        </div>
        
        <div class="events-section">
            <div class="events-header">
                <h2>Community Events</h2>
                <div class="event-count">Showing: <span id="eventCount">0</span></div>
            </div>
            <div id="eventsContainer"></div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
